name: Build Aimlock SO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List files
        run: |
          echo "=== Root ==="
          ls -la
          echo "=== jni ==="
          ls -la jni || echo "jni missing"

      - name: Build .so
        run: |
          NDK=$ANDROID_NDK_LATEST_HOME
          $NDK/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk

      - name: Show outputs
        run: find libs -type f -name "*.so" -exec file {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: aimlock-so
          path: libs/**/*.so